<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YChat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto}
body{background:#fff;overflow:hidden;height:100vh}

/* --- PREMIUM WELCOME SCREEN --- */
#welcome{
position:fixed;inset:0;z-index:999;
background:radial-gradient(1200px 600px at 50% -10%,#f5f5f5 0%,#ffffff 55%);
display:flex;flex-direction:column;align-items:center;justify-content:center;
transition:transform .9s cubic-bezier(.77,0,.18,1),opacity .6s;
}
.logo-premium{
position:relative;width:132px;height:132px;
background:#0a0a0a;border-radius:32px;
display:flex;align-items:center;justify-content:center;
box-shadow:0 20px 60px rgba(0,0,0,0.25);
animation:logoFloat 3s ease-in-out infinite;
}
.logo-premium b{
font-size:68px;font-weight:900;color:#fff;letter-spacing:-2px;
text-shadow:0 1px 0 rgba(0,0,0,0.5);
}
@keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}

  animation:starShine 2.2s ease-in-out infinite;
}
.s1{width:24px;height:24px;top:-10px;right:-10px;animation-delay:0s}
.s2{width:18px;height:18px;bottom:-8px;left:-12px;animation-delay:.35s}
.s3{width:14px;height:14px;top:18px;left:-14px;animation-delay:.7s}
.s4{width:20px;height:20px;bottom:14px;right:-12px;animation-delay:1.05s}
@keyframes starShine{
  0%,100%{opacity:0;transform:scale(.2) rotate(0deg) }
  20%{opacity:1}
  50%{opacity:1;transform:scale(1.6) rotate(180deg)}
  80%{opacity:0;transform:scale(.3) rotate(360deg)}
}
.welcome-text{margin-top:28px;text-align:center}
.welcome-text h1{font-size:32px;font-weight:900;letter-spacing:-1px}
.welcome-text p{color:#888;margin-top:6px;font-size:14px;letter-spacing:.2px}

/* --- LOGIN --- */
#loginPage{
  height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;max-width:380px;margin:0 auto;
}
.login-card{
  width:100%;background:#fff;border:1px solid #eee;border-radius:24px;
  padding:28px 22px;box-shadow:0 10px 40px rgba(0,0,0,.06);
}
.inp{
  width:100%;padding:16px 16px;border:1.5px solid #ececec;border-radius:14px;
  margin:8px 0;font-size:15px;outline:none;transition:.2s;background:#fafafa;
}
.inp:focus{border-color:#111;background:#fff;box-shadow:0 0 0 4px rgba(0,0,0,.06)}
.btn{
  width:100%;padding:16px;background:#111;color:#fff;border:none;border-radius:14px;
  font-weight:800;font-size:15px;margin-top:14px;cursor:pointer;transition:.2s;
}
.btn:active{transform:scale(.98)}
</style>
</head>
<body>

<div id="welcome">
  <div class="logo-premium"><b>Y</b><div class="star s1">
<div id="stars"</div><div class="star s2"></div><div class="star s3"></div><div class="star s4"></div></div>
  <div class="welcome-text"><h1>YChat</h1><p>Premium • Fast • Private</p></div>
</div>

<div id="loginPage">
  <div class="logo-premium" style="width:72px;height:72px;border-radius:18px;margin-bottom:18px"><b style="font-size:36px">Y</b><div class="star s1" style="width:14px;height:14px"></div></div>
  <div class="login-card">
    <h2 style="font-weight:900;margin-bottom:4px">Login</h2>
    <p style="color:#888;font-size:13px;margin-bottom:14px">Username & Password only</p>
    <input id="u" class="inp" placeholder="Username">
    <input id="p" class="inp" type="password" placeholder="Password">
    <button class="btn" onclick="loginCheck()">Login</button>
  </div>
</div>
<div id="blackPage" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;flex-direction:column;z-index:5;">

  <div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;">
    <div style="font-size:60px;font-weight:900;">Y</div>
    <div style="color:#888;">Welcome</div>
  </div>

  <div style="height:65px;background:#111;border-top:1px solid #222;display:flex;color:white;justify-content:space-around;align-items:center;">
    <div style="font-size:26px;color:white">⌂</div>
    <div style="font-size:22px;color:white">💭</div>
    <div style="font-size:22px;color:white">🔍</div>
    <div style="font-size:24px;color:white">★</div>
  </div>

</div>
<script>
setTimeout(()=>{document.getElementById('welcome').style.transform='translateY(-100%)'; document.getElementById('welcome').style.opacity='0';}, 2200);
function loginCheck(){
  let u=document.getElementById('user').value.trim();
let p=document.getElementById('pass').value.trim();
  if(!u||!p){alert('Username Password bhar');return;}
  document.getElementById('loginPage').style.transform='scale(.9)';
  document.getElementById('loginPage').style.opacity='0';
  setTimeout(()=>{
    document.getElementById('loginPage').style.display='none';
    let bp=document.getElementById('blackPage');
    bp.style.display='flex';
    setTimeout(()=>{bp.classList.add('show')},20);
  },300);
}
</script>
</body>
</html>

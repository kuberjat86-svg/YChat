<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YChat.official</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}
.box{background:#111;padding:30px;border-radius:20px;text-align:center}
.logo{width:100px;height:100px;background:#000;border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative;margin:0 auto 15px}
.logo b{font-size:70px;color:#fff}
.logo span{position:absolute;top:-10px;right:-10px;animation:glow 1s infinite alternate}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.3)}}
</style>
</head>
<body>
<div class="box">
<div class="logo"><b>Y</b><span>🌟</span></div>
<h2>YChat.official</h2>
<p style="opacity:.6">Coming back...</p>
</div>
</body>
</html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YChat</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff}#splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999;transition:.6s}.logo{width:90px;height:90px;background:#fff;color:#000;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;animation:p .8s infinite alternate}@keyframes p{to{transform:scale(1.08)}}#lock{position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:9990}.card{background:#141414;border:1px solid #222;padding:26px;border-radius:22px;width:88%;max-width:320px;text-align:center}.card input{width:100%;padding:14px;margin-top:12px;background:#000;border:1px solid #333;border-radius:12px;color:#fff;text-align:center}.card button{width:100%;margin-top:14px;padding:14px;background:#fff;color:#000;border:none;border-radius:12px;font-weight:800}#app{display:none;height:100vh;flex-direction:column}#app.open{display:flex}.top{height:56px;background:#0f0f0f;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;padding:0 16px;justify-content:space-between}.list{flex:1;overflow:auto;padding:12px}.item{display:flex;gap:12px;padding:14px;background:#111;border:1px solid #1e1e1e;margin-bottom:10px;border-radius:16px;cursor:pointer}.av{width:42px;height:42px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}#chat{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:8000}#chat.open{display:flex}.chead{height:56px;background:#0f0f0f;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #1a1a1a}.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}.msg{max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px;word-break:break-word}.me{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:6px}.other{align-self:flex-start;background:#222;color:#fff;border-bottom-left-radius:6px}.bar{display:flex;gap:8px;padding:10px;background:#0f0f0f;border-top:1px solid #1a1a1a}.bar input{flex:1;padding:12px 16px;border-radius:22px;border:1px solid #333;background:#000;color:#fff}.bar button{width:42px;height:42px;border-radius:50%;border:none;background:#fff;font-weight:900}</style></head><body><div id="splash"><div class="logo">Y</div></div><div id="lock"><div class="card"><h3>YChat</h3><p style="color:#777;font-size:12px;margin-top:4px">Insta Style Real Chat</p><input id="pIn" type="password" placeholder="Passcode - 1234"><input id="nIn" placeholder="Tera Naam - Kuber / Ajay"><button onclick="go()">Unlock & Start Chat</button></div></div><div id="app"><div class="top"><b>YChat.official</b><span style="font-size:11px;color:#0f0">● LIVE</span></div><div class="list" id="list"></div></div><div id="chat"><div class="chead"><button onclick="closeC()" style="background:none;border:none;color:#fff;font-size:22px">←</button><b id="cName"></b></div><div class="msgs" id="msgs"></div><div class="bar"><input id="mIn" placeholder="Message..."><button onclick="send()">↑</button></div></div><script>
const firebaseConfig = {
  apiKey: "AIzaSyDIBwaQmRsg54HX6uM4T6Yi2HzGt_nn6zA",
  authDomain: "ychat-2b217.firebaseapp.com",
  databaseURL: "https://ychat-2b217-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ychat-2b217",
  storageBucket: "ychat-2b217.firebasestorage.app",
  messagingSenderId: "971940150616",
  appId: "1:971940150616:web:b925b3d55afbe37cc2b92d",
  measurementId: "G-QTPRNJJLLK"
};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
setTimeout(()=>{let s=document.getElementById('splash'); s.style.opacity='0'; setTimeout(()=>s.style.display='none',500)},900);
let myName='',curChat='';
function go(){
 let p=document.getElementById('pIn').value;
 let n=document.getElementById('nIn').value.trim();
 if(!p||!n) return alert('Naam + Pass bhar bhai');
 let s=localStorage.getItem('pass');
 if(s && s!==p) return alert('Wrong pass');
 localStorage.setItem('pass',p); localStorage.setItem('yname',n);
 myName=n;
 document.getElementById('lock').style.display='none';
 document.getElementById('app').classList.add('open');
 render();
}
if(localStorage.getItem('yname')){document.getElementById('nIn').value=localStorage.getItem('yname');}
function getChatId(a,b){return [a,b].sort().join('_').toLowerCase().replace(/[^a-z0-9_]/g,'')}
const allUsers=['Kuber','Ajay','Rahul','YChat Team','Sahil','Aman'];
function render(){
 let l=document.getElementById('list'); l.innerHTML='';
 allUsers.forEach(u=>{
  if(u.toLowerCase()===myName.toLowerCase()) return;
  let d=document.createElement('div'); d.className='item';
  d.innerHTML=`<div class="av">${u[0]}</div><div><b>${u}</b><div style="font-size:11px;color:#666">tap to chat - real time</div></div>`;
  d.onclick=()=>openC(u); l.appendChild(d);
 })
}
function openC(name){
 curChat=name; document.getElementById('cName').innerText=name;
 document.getElementById('chat').classList.add('open');
 let msgs=document.getElementById('msgs'); msgs.innerHTML='';
 let chatId=getChatId(myName,name);
 db.ref('chats/'+chatId).off();
 db.ref('chats/'+chatId).on('child_added',snap=>{
  let m=snap.val();
  let div=document.createElement('div');
  div.className='msg '+(m.sender===myName?'me':'other');
  div.innerText=m.text;
  msgs.appendChild(div); msgs.scrollTop=msgs.scrollHeight;
 });
}
function closeC(){document.getElementById('chat').classList.remove('open'); curChat='';}
function send(){
 let i=document.getElementById('mIn'); let t=i.value.trim(); if(!t||!curChat) return;
 let chatId=getChatId(myName,curChat);
 db.ref('chats/'+chatId).push({sender:myName,text:t,time:Date.now()});
 i.value='';
}
document.getElementById('mIn').addEventListener('keydown',e=>{if(e.key==='Enter') send()});
</script></body></html>

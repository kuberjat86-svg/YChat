<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YChat.official</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#000;color:#fff;overflow:hidden}
#splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
.logo-wrap{position:relative;width:120px;height:120px}.logo-box{width:120px;height:120px;background:#151515;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:75px;font-weight:900}
.star-main{position:absolute;top:-10px;right:-10px;font-size:36px}
.p{position:absolute;top:0;right:0;opacity:0}
.animate .star-main{animation:blast .6s forwards}.animate .p1{animation:ex1 .75s .08s forwards}.animate .p2{animation:ex2 .75s .08s forwards}.animate .p3{animation:ex3 .75s .08s forwards}.animate .p4{animation:ex4 .75s .08s forwards}
@keyframes blast{0%{transform:scale(1)}100%{transform:scale(0) rotate(200deg);opacity:0}}
@keyframes ex1{0%{opacity:1}100%{transform:translate(55px,-55px) scale(0);opacity:0}}
@keyframes ex2{0%{opacity:1}100%{transform:translate(-55px,-55px) scale(0);opacity:0}}
@keyframes ex3{0%{opacity:1}100%{transform:translate(55px,55px) scale(0);opacity:0}}
@keyframes ex4{0%{opacity:1}100%{transform:translate(-55px,55px) scale(0);opacity:0}}

/* LOCK SCREEN */
#lock{position:fixed;inset:0;background:#000;z-index:9000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#lock.show{display:flex}
.lock-card{width:100%;max-width:340px;background:#111;border:1px solid #222;border-radius:24px;padding:28px;text-align:center}
.lock-card h2{font-size:22px;margin-bottom:8px}.lock-card p{color:#666;font-size:13px;margin-bottom:20px}
.lock-card input{width:100%;background:#000;border:1px solid #333;border-radius:12px;padding:14px 16px;color:#fff;font-size:18px;outline:none;text-align:center;letter-spacing:2px}
.lock-card button{width:100%;margin-top:16px;background:#fff;color:#000;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:15px}
.lock-card button:active{transform:scale(.98)}
#app{display:flex;height:100vh;align-items:center;justify-content:center;flex-direction:column}
</style>
</head>
<body>

<div id="splash">
  <div class="logo-wrap" id="wrap"><div class="logo-box">Y</div><div class="star-main">🌟</div><div class="p p1">✦</div><div class="p p2">✦</div><div class="p p3">✦</div><div class="p p4">✦</div></div>
</div>

<div id="lock">
  <div class="lock-card">
    <h2 id="lockTitle">Set Start Pass</h2>
    <p id="lockDesc">Kuch bhi rakho - number, text, emoji</p>
    <input id="passInput" type="text" placeholder="e.g. 1234 or kuber@07">
    <button id="passBtn">Set Pass</button>
    <p id="error" style="color:#ff4444;margin-top:12px;font-size:12px;display:none">Wrong pass</p>
  </div>
</div>

<div id="app"><h1>YChat</h1><p>Welcome to YChat.official</p></div>

<script>
const splash=document.getElementById('splash');
const wrap=document.getElementById('wrap');
const lock=document.getElementById('lock');
const title=document.getElementById('lockTitle');
const desc=document.getElementById('lockDesc');
const input=document.getElementById('passInput');
const btn=document.getElementById('passBtn');
const error=document.getElementById('error');

function showLock(){
  const saved=localStorage.getItem('ychat_start_pass');
  if(saved){
    title.innerText='Enter Pass';
    desc.innerText='Start pass daalo to continue';
    btn.innerText='Unlock';
  }else{
    title.innerText='Set Start Pass';
    desc.innerText='Pehli baar kuch bhi pass set karo';
    btn.innerText='Set Pass';
  }
  lock.classList.add('show');
}

window.addEventListener('load',()=>{
  setTimeout(()=>wrap.classList.add('animate'),800);
  setTimeout(()=>{
    splash.style.opacity='0';
    setTimeout(()=>{
      splash.remove();
      showLock();
    },500);
  },1600);
});

btn.onclick=()=>{
  const val=input.value.trim();
  if(!val){input.style.borderColor='#ff4444';return;}
  const saved=localStorage.getItem('ychat_start_pass');
  if(!saved){
    localStorage.setItem('ychat_start_pass',val);
    lock.classList.remove('show');
  }else{
    if(val===saved){
      lock.classList.remove('show');
    }else{
      error.style.display='block';
      input.style.borderColor='#ff4444';
      setTimeout(()=>{error.style.display='none';input.style.borderColor='#333'},2000);
    }
  }
};
</script>
</body>
</html>

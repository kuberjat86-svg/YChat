<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YChat.official</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#000;color:#fff;overflow:hidden}

/* SPLASH */
#splash{
  position:fixed;inset:0;background:#000;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:9999;transition:opacity .5s ease
}
.logo-wrap{position:relative;width:120px;height:120px}
.logo-box{
  width:120px;height:120px;background:#151515;
  border-radius:28px;display:flex;
  align-items:center;justify-content:center;
  font-size:75px;font-weight:900;color:#fff;
  box-shadow:0 10px 40px rgba(255,255,255,.1);
}
.star-main{position:absolute;top:-10px;right:-10px;font-size:36px;z-index:5}
.p{position:absolute;top:0;right:0;font-size:16px;opacity:0;z-index:4}

.animate .star-main{animation:blast .6s cubic-bezier(.175,.885,.32,1.275) forwards}
.animate .p1{animation:ex1 .75s .08s cubic-bezier(.2,.8,.2,1) forwards}
.animate .p2{animation:ex2 .75s .08s cubic-bezier(.2,.8,.2,1) forwards}
.animate .p3{animation:ex3 .75s .08s cubic-bezier(.2,.8,.2,1) forwards}
.animate .p4{animation:ex4 .75s .08s cubic-bezier(.2,.8,.2,1) forwards}

@keyframes blast{0%{transform:scale(1) rotate(0)}50%{transform:scale(1.4) rotate(90deg)}100%{transform:scale(0) rotate(200deg);opacity:0}}
@keyframes ex1{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(55px,-55px) scale(0) rotate(180deg);opacity:0}}
@keyframes ex2{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-55px,-55px) scale(0) rotate(-180deg);opacity:0}}
@keyframes ex3{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(55px,55px) scale(0) rotate(180deg);opacity:0}}
@keyframes ex4{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-55px,55px) scale(0) rotate(-180deg);opacity:0}}

.brand{margin-top:24px;color:#666;letter-spacing:4px;font-size:14px;opacity:0;animation:fadeUp .6s .4s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* MAIN APP - demo */
#app{display:flex;height:100vh;align-items:center;justify-content:center;flex-direction:column}
#app h1{font-size:48px;font-weight:900}
#app p{color:#555;margin-top:10px}
</style>
</head>
<body>

<div id="splash">
  <div class="logo-wrap" id="wrap">
    <div class="logo-box">Y</div>
    <div class="star-main">🌟</div>
    <div class="p p1">✦</div>
    <div class="p p2">✦</div>
    <div class="p p3">✦</div>
    <div class="p p4">✦</div>
  </div>
  <div class="brand">YChat.official</div>
</div>

<div id="app">
  <h1>YChat</h1>
  <p>Welcome to YChat.official</p>
</div>

<script>
window.addEventListener('load',()=>{
  setTimeout(()=>{
    document.getElementById('wrap').classList.add('animate');
  },800);
  setTimeout(()=>{
    document.getElementById('splash').style.opacity='0';
    setTimeout(()=>document.getElementById('splash').remove(),500);
  },1600);
});
</script>
</body>
</html>

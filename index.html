<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>YChat</title>
<style>body{font-family:sans-serif;background:#000;color:#fff;margin:0}.header{padding:15px;text-align:center;font-weight:bold;border-bottom:1px solid #222}.chat{padding:10px}.msg{background:#222;padding:10px;border-radius:18px;margin:5px;max-width:70%}.input{display:flex;position:fixed;bottom:0;width:100%;background:#000;padding:10px}.input input{flex:1;padding:12px;border-radius:25px;border:none;background:#222;color:#fff}.input button{margin-left:10px;padding:12px 20px;border-radius:25px;border:none;background:#0095f6;color:#fff}</style>
</head><body><div class="header">YChat 💬</div><div class="chat" id="chat"></div><div class="input"><input id="text" placeholder="Message..."><button onclick="send()">Send</button></div><script>function send(){let t=document.getElementById('text');if(!t.value)return;let d=document.createElement('div');d.className='msg';d.innerText=t.value;document.getElementById('chat').appendChild(d);t.value='';}</script></body></html>

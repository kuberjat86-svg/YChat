
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YChat Premium</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
html,body{width:100%;height:100%;background:#fff;overflow:hidden}
#welcome{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.8s ease}
.logo-wrap{position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center}
.logo{width:115px;height:115px;background:#000;border-radius:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:float 3s ease-in-out infinite}
.logo b{color:#fff;font-size:62px;font-weight:900}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.star{position:absolute;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #fff 0%, #7ec8ff 20%, #0080ff 60%, #004aad 100%);box-shadow:0 0 12px #00aaff,0 0 22px #0080ff;animation:shine 2s ease-in-out infinite}
@keyframes shine{0%,100%{opacity:.7;transform:scale(.9)}50%{opacity:1;transform:scale(1.5)}}
.s1{top:8%;left:18%}.s2{top:12%;right:16%}.s3{bottom:18%;left:14%}.s4{bottom:10%;right:18%}
#loginPage{position:fixed;inset:0;z-index:90;background:#fff;display:none;align-items:center;justify-content:center}
.card{width:320px;background:#fff;border:1px solid #f0f0f0;border-radius:24px;padding:26px;display:flex;flex-direction:column;align-items:center;box-shadow:0 15px 50px rgba(0,0,0,.07)}
.card input{width:100%;padding:14px 14px;background:#f5f5f7;border:1.5px solid #f5f5f7;border-radius:12px;margin-top:11px;outline:none;font-size:15px}
.card input:focus{background:#fff;border-color:#000}
.card button{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:12px;font-weight:700;margin-top:14px}
#blackPage{position:fixed;inset:0;z-index:80;background:#000;display:none;flex-direction:column}
.topbar{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;color:#fff;border-bottom:1px solid #151515}
.bottom{height:84px;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center;margin-top:auto;color:#fff;background:#000}
</style>
</head>
<body>
<div id="welcome">
<div class="logo-wrap">
<div class="star s1"></div><div class="star s2"></div><div class="star s3"></div><div class="star s4"></div>
<div class="logo"><b>Y</b></div>
</div>
<h2 style="margin-top:22px;font-weight:800;letter-spacing:-1px">YChat</h2>
<p style="color:#888;font-size:14px;margin-top:6px">Premium • Fast • Private</p>
</div>

<div id="loginPage">
<div class="card">
<div class="logo" style="width:74px;height:74px;border-radius:20px"><b style="font-size:36px">Y</b></div>
<h3 style="margin-top:14px">Login</h3>
<p style="font-size:12px;color:#8a8a8e;margin-top:4px">Username & Password only</p>
<input id="user" placeholder="Userr">
<input id="pass" type="password" placeholder="Pass">
<button onclick="loginCheck()">Login</button>
</div>
</div>

<div id="blackPage">
<div class="topbar"><b style="font-size:18px">YChat</b><span>♡ &nbsp; ✈</span></div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#333">Home Feed Premium</div>
<div class="bottom">
<div style="color:#fff;font-size:26px">⌂</div>
<div style="color:#fff;font-size:22px">◍</div>
<div style="color:#fff;font-size:22px">◎</div>
<div style="color:#fff;font-size:24px">☺</div>
</div>
</div>

<script>
setTimeout(()=>{
let w=document.getElementById('welcome');
w.style.transform='translateY(-100%)';
w.style.opacity='0';
setTimeout(()=>{
w.style.display='none';
document.getElementById('loginPage').style.display='flex';
},700);
},2100);

function loginCheck(){
let u=document.getElementById('user').value.trim();
let p=document.getElementById('pass').value.trim();
if(!u||!p){alert('Userr Pass dal');return;}
document.getElementById('loginPage').style.display='none';
document.getElementById('blackPage').style.display='flex';
}
</script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YChat</title><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body,html{height:100%;width:100%;overflow:hidden}#welcome{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.logo-wrap{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center}.logo{width:120px;height:120px;background:#000;border-radius:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:float 3s infinite}.logo b{color:#fff;font-size:64px;font-weight:900}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.star{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#7ec8ff 20%,#0080ff 60%,#004aad);box-shadow:0 0 12px #00aaff;animation:shine 2s infinite}@keyframes shine{0%,100%{opacity:.7;transform:scale(.9)}50%{opacity:1;transform:scale(1.4)}}.s1{top:10%;left:15%}.s2{top:10%;right:15%}.s3{bottom:15%;left:15%}.s4{bottom:10%;right:15%}#login{position:fixed;inset:0;z-index:90;background:#fff;display:none;align-items:center;justify-content:center}.card{width:340px;padding:28px;border-radius:24px;box-shadow:0 15px 50px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center}.card input{width:100%;padding:14px;margin-top:12px;border-radius:12px;border:1.5px solid #eee;background:#f5f5f7;outline:none;font-size:15px}.card button{width:100%;padding:14px;margin-top:14px;border-radius:12px;border:none;background:#000;color:#fff;font-weight:700;font-size:15px}#app{position:fixed;inset:0;z-index:80;background:#000;display:none;flex-direction:column;color:#fff}.top{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1a1a1a;flex-shrink:0}.main{flex:1;overflow-y:auto;background:#0a0a0a}.uRow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #151515;cursor:pointer}.uRow:hover{background:#111}.av{width:42px;height:42px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-weight:700}.bottom{height:68px;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center;background:#000;flex-shrink:0}.bI{font-size:22px;opacity:.5;cursor:pointer}.bI.active{opacity:1}#chatBox{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column}.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}.msg{max-width:72%;padding:10px 14px;border-radius:18px;font-size:14.5px}.me{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px}.other{align-self:flex-start;background:#222;color:#fff;border-bottom-left-radius:4px}.inp{height:64px;display:flex;gap:8px;padding:10px;border-top:1px solid #1a1a1a;background:#000}.inp input{flex:1;background:#1a1a1a;border:none;border-radius:22px;padding:0 16px;color:#fff;outline:none}.inp button{width:42px;height:42px;border-radius:50%;border:none;background:#fff;color:#000;font-weight:900}</style></head><body><div id="welcome"><div class="logo-wrap"><div class="star s1"></div><div class="star s2"></div><div class="star s3"></div><div class="star s4"></div><div class="logo"><b>Y</b></div></div><h2 style="margin-top:20px;color:#000;font-weight:800">YChat</h2><p style="color:#888;margin-top:6px;font-size:14px">Real-time

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YChat</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff}#splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999}.box{width:100px;height:100px;background:#1a1a1a;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900}#lock{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9000}.card{background:#111;border:1px solid #333;padding:24px;border-radius:20px;width:300px;text-align:center}.card input{width:100%;padding:12px;background:#000;border:1px solid #333;color:#fff;border-radius:10px;text-align:center;margin-top:10px}.card button{width:100%;margin-top:15px;padding:12px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:700}#app{display:none;height:100vh;flex-direction:column}#app.open{display:flex}.top{height:50px;background:#111;display:flex;align-items:center;padding:0 15px;justify-content:space-between;border-bottom:1px solid #222}.list{flex:1;overflow:auto;padding:10px}.item{display:flex;gap:10px;padding:12px;background:#101010;margin-bottom:8px;border-radius:12px}.av{width:40px;height:40px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center}#chat{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:8000}#chat.open{display:flex}.chead{height:50px;background:#111;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid #222}.msgs{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:8px}.msg{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px}.me{align-self:flex-end;background:#fff;color:#000}.other{align-self:flex-start;background:#222;color:#fff}.bar{display:flex;gap:8px;padding:10px;background:#111;border-top:1px solid #222}.bar input{flex:1;padding:12px;border-radius:20px;border:1px solid #333;background:#000;color:#fff}.bar button{width:42px;height:42px;border-radius:50%;border:none;background:#fff}</style></head><body><div id="splash"><div class="box">Y</div></div><div id="lock"><div class="card"><h3>Set Pass</h3><input id="pIn" placeholder="1234"><button onclick="unlock()">Unlock</button></div></div><div id="app"><div class="top"><b>YChat.official</b></div><div class="list" id="list"></div></div><div id="chat"><div class="chead"><button onclick="closeC()" style="width:30px;height:30px">←</button><b id="cName">Kuber</b></div><div class="msgs" id="msgs"></div><div class="bar"><input id="mIn" placeholder="Message..."><button onclick="send()">↑</button></div></div><script>setTimeout(()=>{document.getElementById('splash').style.display='none'},1200);let myName=localStorage.getItem('yname')||prompt("Naam likh:");if(myName){localStorage.setItem('yname',myName)}function unlock(){let p=document.getElementById('pIn').value;if(!p)return;let s=localStorage.getItem('pass');if(!s){localStorage.setItem('pass',p)}else{if(p!==s){alert('Wrong');return}}document.getElementById('lock').style.display='none';document.getElementById('app').classList.add('open');render()}const users=['Kuber','Ajay','YChat Team'];function render(){let l=document.getElementById('list');l.innerHTML='';users.forEach(u=>{if(u==myName)return;let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="av">${u[0]}</div><div><b>${u}</b></div>`;d.onclick=()=>openC(u);l.appendChild(d)})}function openC(name){document.getElementById('cName').innerText=name;document.getElementById('chat').classList.add('open');document.getElementById('msgs').innerHTML=''}function closeC(){document.getElementById('chat').classList.remove('open')}function send(){let i=document.getElementById('mIn');let t=i.value.trim();if(!t)return;let d=document.createElement('div');d.className='msg me';d.innerText=t;document.getElementById('msgs').appendChild(d);i.value='';let m=document.getElementById('msgs');m.scrollTop=m.scrollHeight;setTimeout(()=>{let r=document.createElement('div');r.className='msg other';r.innerText='ok: '+t;document.getElementById('msgs').appendChild(r);m.scrollTop=m.scrollHeight},600)}document.getElementById('mIn').addEventListener('keydown',e=>{if(e.key==='Enter')send()})</script></body></html>

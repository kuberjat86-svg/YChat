<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YChat</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body{background:#000;color:#fff;overflow:hidden}#splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999;transition:0.6s}.splash-logo{width:90px;height:90px;background:#fff;color:#000;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;animation:pop 0.8s infinite alternate}@keyframes pop{to{transform:scale(1.1)}}#lock{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:9990}.lock-card{background:#141414;border:1px solid #222;padding:28px;border-radius:24px;width:90%;max-width:320px;text-align:center;animation:up 0.5s}@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}.lock-card h2{margin-bottom:8px}.lock-card input{width:100%;padding:14px;margin-top:16px;background:#000;border:1px solid #333;border-radius:12px;color:#fff;text-align:center;font-size:16px;letter-spacing:4px;outline:none}.lock-card button{width:100%;margin-top:16px;padding:14px;background:#fff;color:#000;border:none;border-radius:12px;font-weight:800;font-size:15px}#app{display:none;height:100vh;flex-direction:column;animation:fade 0.4s}#app.open{display:flex}@keyframes fade{from{opacity:0}to{opacity:1}}.top{height:56px;background:#0f0f0f;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #1a1a1a;justify-content:space-between}.list{flex:1;overflow:auto;padding:12px;background:#000}.item{display:flex;align-items:center;gap:12px;padding:14px;background:#111;border:1px solid #1e1e1e;margin-bottom:10px;border-radius:16px;transition:0.2s}.item:active{transform:scale(0.97)}.av{width:44px;height:44px;background:#1e1e1e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}#chat{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:8000}#chat.open{display:flex;animation:slide 0.3s}@keyframes slide{from{transform:translateX(100%)}to{transform:translateX(0)}}.chead{height:56px;background:#0f0f0f;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #1a1a1a}.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#000}.msg{max-width:76%;padding:11px 16px;border-radius:20px;font-size:14.5px;line-height:1.4;animation:msg 0.2s}@keyframes msg{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}.me{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:6px}.other{align-self:flex-start;background:#1e1e1e;color:#fff;border-bottom-left-radius:6px}.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#0f0f0f;border-top:1px solid #1a1a1a}.bar input{flex:1;padding:13px 18px;border-radius:24px;border:1px solid #222;background:#000;color:#fff;outline:none}.bar button{width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:#000;font-size:18px;font-weight:700}</style></head><body><div id="splash"><div class="splash-logo">Y</div></div><div id="lock"><div class="lock-card"><h2>YChat</h2><p style="color:#888;font-size:13px">Enter passcode</p><input id="pIn" type="password" placeholder="••••"><button onclick="unlock()">Unlock</button></div></div><div id="app"><div class="top"><b>YChat.official</b><span style="font-size:12px;color:#666">online</span></div><div class="list" id="list"></div></div><div id="chat"><div class="chead"><button onclick="closeC()" style="background:none;border:none;color:#fff;font-size:22px">←</button><b id="cName">Kuber</b></div><div class="msgs" id="msgs"></div><div class="bar"><input id="mIn" placeholder="Message..."><button onclick="send()">↑</button></div></div><script>setTimeout(()=>{document.getElementById('splash').style.opacity='0';setTimeout(()=>document.getElementById('splash').style.display='none',600)},1000);let myName=localStorage.getItem('yname')||prompt("Tera naam?");if(myName) localStorage.setItem('yname',myName);function unlock(){let p=document.getElementById('pIn').value;if(!p) return;let s=localStorage.getItem('pass');if(!s){localStorage.setItem('pass',p)}else{if(p!==s){alert('Wrong pass');return}}document.getElementById('lock').style.display='none';document.getElementById('app').classList.add('open');render()}const users=['Kuber','Ajay','YChat Team','Bhai'];function render(){let l=document.getElementById('list');l.innerHTML='';users.forEach(u=>{if(u==myName) return;let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="av">${u[0]}</div><div><b>${u}</b><div style="font-size:12px;color:#666">tap to chat</div></div>`;d.onclick=()=>openC(u);l.appendChild(d)})}let cur='';function openC(n){cur=n;document.getElementById('cName').innerText=n;document.getElementById('chat').classList.add('open');document.getElementById('msgs').innerHTML=`<div style="text-align:center;color:#555;font-size:12px;margin:10px">Chat with ${n}</div>`}function closeC(){document.getElementById('chat').classList.remove('open')}function send(){let i=document.getElementById('mIn');let t=i.value.trim();if(!t) return;let m=document.getElementById('msgs');let d=document.createElement('div');d.className='msg me';d.innerText=t; m.appendChild(d);i.value='';m.scrollTop=m.scrollHeight;setTimeout(()=>{let r=document.createElement('div');r.className='msg other';r.innerText='ok: '+t;m.appendChild(r);m.scrollTop=m.scrollHeight},500)}document.getElementById('mIn').addEventListener('keydown',e=>{if(e.key==='Enter') send()})</script></body></html>
